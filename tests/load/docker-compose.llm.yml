# AI timing with a real model (experiment 3, optional). Only the parser uses the model.
# Needs Ollama on the host with the model pulled:  ollama pull qwen3:8b
#   docker compose -f docker-compose.yml -f tests/load/docker-compose.llm.yml up -d --no-deps ai-parser
# Switch back:  docker compose up -d --no-deps ai-parser
services:
  ai-parser:
    environment:
      LLM_PROVIDER: ollama
      LLM_MODEL: "${LLM_MODEL:-qwen3:8b}"
      LLM_BASE_URL: http://host.docker.internal:11434
      LLM_TIMEOUT_S: "${LLM_TIMEOUT_S:-15}"
