<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Booking worker throughput: 1 vs 3 consumers (backlog drain)">
<rect width="760" height="400" fill="#ffffff"/>
<text x="64" y="26" font-size="16" font-weight="600" fill="#1f2328">Booking worker throughput: 1 vs 3 consumers (backlog drain)</text>
<text x="64" y="45" font-size="12" fill="#5d6670">booking.requested has 6 partitions; ~15,000 queued bookings per run, all written once</text>
