<text x="233" y="362" font-size="12" fill="#1f2328" text-anchor="middle">1 worker</text>
<path d="M559,344 V199.971 Q559,195.971 563,195.971 H579 Q583,195.971 583,199.971 V344 Z" fill="#2a78d6"><title>Bookings written per second, 3 workers: 1113/s</title></path>
<text x="571" y="191.971" font-size="10" fill="#1f2328" text-anchor="middle">1113</text>
<text x="571" y="362" font-size="12" fill="#1f2328" text-anchor="middle">3 workers</text>
