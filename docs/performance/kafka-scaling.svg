<text x="56" y="348" font-size="11" fill="#5d6670" text-anchor="end">0</text>
<line x1="64" x2="740" y1="211" y2="211" stroke="#e6e8eb" stroke-width="1"/>
<text x="56" y="215" font-size="11" fill="#5d6670" text-anchor="end">1000</text>
<line x1="64" x2="740" y1="78" y2="78" stroke="#e6e8eb" stroke-width="1"/>
<text x="56" y="82" font-size="11" fill="#5d6670" text-anchor="end">2000</text>
<text x="16" y="211" font-size="11" fill="#5d6670" text-anchor="middle" transform="rotate(-90 16 211)">bookings per second</text>
<path d="M221,344 V266.471 Q221,262.471 225,262.471 H241 Q245,262.471 245,266.471 V344 Z" fill="#2a78d6"><title>Bookings written per second, 1 worker: 613/s</title></path>
