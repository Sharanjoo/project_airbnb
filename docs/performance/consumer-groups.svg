<text x="56" y="82" font-size="11" fill="#5d6670" text-anchor="end">2500</text>
<text x="16" y="211" font-size="11" fill="#5d6670" text-anchor="middle" transform="rotate(-90 16 211)">events per second</text>
<path d="M195,344 V287.0328 Q195,283.0328 199,283.0328 H215 Q219,283.0328 219,287.0328 V344 Z" fill="#2a78d6"><title>booking-worker-cg, Booking worker alone: 573/s</title></path>
<text x="207" y="279.0328" font-size="10" fill="#1f2328" text-anchor="middle">573</text>
<text x="233" y="362" font-size="12" fill="#1f2328" text-anchor="middle">Booking worker alone</text>
<path d="M533,344 V287.884 Q533,283.884 537,283.884 H553 Q557,283.884 557,287.884 V344 Z" fill="#2a78d6"><title>booking-worker-cg, Three groups at once: 565/s</title></path>
<text x="545" y="279.884" font-size="10" fill="#1f2328" text-anchor="middle">565</text>
<path d="M559,344 V129.348 Q559,125.34800000000001 563,125.34800000000001 H579 Q583,125.34800000000001 583,129.348 V344 Z" fill="#eb6834"><title>messaging-cg, Three groups at once: 2055/s</title></path>
