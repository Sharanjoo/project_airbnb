<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="booking.requested backlog: one consumer group vs three">
<rect width="760" height="400" fill="#ffffff"/>
<text x="64" y="26" font-size="16" font-weight="600" fill="#1f2328">booking.requested backlog: one consumer group vs three</text>
<text x="64" y="45" font-size="12" fill="#5d6670">Each group keeps its own offsets and handled every event; the booking worker is as fast either way</text>
<rect x="64" y="56" width="10" height="10" rx="2" fill="#2a78d6"/>
<text x="79" y="65" font-size="12" fill="#1f2328">booking-worker-cg</text>
<rect x="202.2" y="56" width="10" height="10" rx="2" fill="#eb6834"/>
<text x="217.2" y="65" font-size="12" fill="#1f2328">messaging-cg</text>
<rect x="307.4" y="56" width="10" height="10" rx="2" fill="#1baf7a"/>
<text x="322.4" y="65" font-size="12" fill="#1f2328">analytics-cg</text>
<line x1="64" x2="740" y1="344" y2="344" stroke="#e6e8eb" stroke-width="1"/>
<text x="56" y="348" font-size="11" fill="#5d6670" text-anchor="end">0</text>
<line x1="64" x2="740" y1="211" y2="211" stroke="#e6e8eb" stroke-width="1"/>
<text x="56" y="215" font-size="11" fill="#5d6670" text-anchor="end">1250</text>
