<path d="M585,344 V116.4736 Q585,112.4736 589,112.4736 H605 Q609,112.4736 609,116.4736 V344 Z" fill="#1baf7a"><title>analytics-cg, Three groups at once: 2176/s</title></path>
<text x="597" y="108.4736" font-size="10" fill="#1f2328" text-anchor="middle">2176</text>
<text x="571" y="362" font-size="12" fill="#1f2328" text-anchor="middle">Three groups at once</text>
